version: '3.8'
services:
  #---# PHP-FPM #---#
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: WebSistemaJugos_app
    restart: unless-stopped
    working_dir: /var/www/
    environment:
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: merakifruit
      DB_USERNAME: root
      DB_PASSWORD: secret
      APP_URL: https://merakifruit.techinnovats.com
    volumes:
      - public-data:/var/www/public
      - storage-data:/var/www/storage
    depends_on:
      - db
    networks:
      - meraki-net

  #---# NGINX #---#
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 128m
    container_name: WebSistemaJugos_nginx
    restart: unless-stopped
    ports:
      - "6080:80"
    volumes:
      - public-data:/var/www/public
      - storage-data:/var/www/storage
    depends_on:
      - app
    networks:
      - meraki-net

  #---# MySQL #---#
  db:
    image: mysql:8.0
    deploy:
      resources:
        limits:
          memory: 1g
    container_name: WebSistemaJugos_db
    restart: unless-stopped
    ports:
      - "6306:3306"
    environment:
      MYSQL_DATABASE: merakifruit
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
      - ./merakifruit.sql:/docker-entrypoint-initdb.d/merakifruit.sql
    networks:
      - meraki-net

  #---# Pusher (Soketi) #---#
  pusher:
    image: 'quay.io/soketi/soketi:latest-16-alpine'
    deploy:
      resources:
        limits:
          memory: 256m
    container_name: WebSistemaJugos_pusher
    restart: unless-stopped
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_APP_ID: ${PUSHER_APP_ID}
      SOKETI_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_APP_SECRET: ${PUSHER_APP_SECRET}
    networks:
      - meraki-net

networks:
  meraki-net:
    driver: bridge

volumes:
  db-data:
    driver: local
  public-data:
    driver: local
  storage-data:
    driver: local